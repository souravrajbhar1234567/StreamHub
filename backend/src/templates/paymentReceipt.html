<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>StreamHub Payment Receipt</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #0b0c10; color: #ffffff; padding: 20px; }
    .container { max-width: 550px; margin: 0 auto; background: #16171d; border-radius: 12px; padding: 32px; border: 1px solid #2e303a; }
    .logo { font-size: 24px; font-weight: bold; color: #c084fc; margin-bottom: 24px; }
    .invoice-table { width: 100%; border-collapse: collapse; margin: 20px 0; }
    .invoice-table td { padding: 8px 0; border-bottom: 1px solid #2e303a; color: #d1d5db; }
    .total-row { font-size: 18px; font-weight: bold; color: #a855f7; }
    .footer { font-size: 12px; color: #9ca3af; margin-top: 30px; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">StreamHub</div>
    <h2>Payment Receipt</h2>
    <p>Hi {{NAME}}, thank you for your payment!</p>
    <table class="invoice-table">
      <tr><td>Invoice Number:</td><td><strong>{{INVOICE_NUMBER}}</strong></td></tr>
      <tr><td>Plan:</td><td>{{PLAN_NAME}}</td></tr>
      <tr><td>Date:</td><td>{{DATE}}</td></tr>
      <tr><td>Transaction ID:</td><td>{{TRANSACTION_ID}}</td></tr>
      <tr class="total-row"><td>Total Paid:</td><td>₹{{AMOUNT}}</td></tr>
    </table>
    <div class="footer">&copy; 2026 StreamHub. All rights reserved.</div>
  </div>
</body>
</html>
