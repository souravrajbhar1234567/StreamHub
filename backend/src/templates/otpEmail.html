<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>StreamHub Verification Code</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #0b0c10; color: #ffffff; padding: 20px; }
    .container { max-width: 500px; margin: 0 auto; background: #16171d; border-radius: 12px; padding: 32px; border: 1px solid #2e303a; }
    .logo { font-size: 24px; font-weight: bold; color: #c084fc; margin-bottom: 24px; }
    .code { font-size: 36px; letter-spacing: 6px; font-weight: 800; color: #a855f7; background: #232530; padding: 16px; border-radius: 8px; text-align: center; margin: 24px 0; }
    .footer { font-size: 12px; color: #9ca3af; margin-top: 30px; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">StreamHub</div>
    <h2>Your Verification Code</h2>
    <p>Use the following 6-digit one-time passcode (OTP) to verify your account. This code is valid for 10 minutes.</p>
    <div class="code">{{OTP_CODE}}</div>
    <p>If you did not request this verification, you can safely ignore this email.</p>
    <div class="footer">&copy; 2026 StreamHub Platform. All rights reserved.</div>
  </div>
</body>
</html>
