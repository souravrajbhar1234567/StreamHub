<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Subscription Activated</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #0b0c10; color: #ffffff; padding: 20px; }
    .container { max-width: 500px; margin: 0 auto; background: #16171d; border-radius: 12px; padding: 32px; border: 1px solid #2e303a; }
    .logo { font-size: 24px; font-weight: bold; color: #c084fc; margin-bottom: 24px; }
    .badge { display: inline-block; padding: 6px 16px; background: rgba(168, 85, 247, 0.2); color: #c084fc; border-radius: 20px; font-weight: bold; }
    .footer { font-size: 12px; color: #9ca3af; margin-top: 30px; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">StreamHub</div>
    <h2>Welcome to StreamHub {{PLAN_NAME}}! 🎉</h2>
    <p>Hi {{NAME}}, your subscription has been successfully activated.</p>
    <div style="margin: 20px 0;"><span class="badge">{{PLAN_NAME}} Plan Active</span></div>
    <p>Enjoy uninterrupted HD/4K streaming, offline downloads, and exclusive premium content!</p>
    <div class="footer">&copy; 2026 StreamHub. All rights reserved.</div>
  </div>
</body>
</html>
